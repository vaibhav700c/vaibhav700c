<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Terminal introducing Vaibhav Jangid, final-year CS student at VIT. Still shipping.">
  <style>
    @keyframes rv {
      0%    { clip-path: inset(0 100% 0 0); }
      3.2%  { clip-path: inset(0 0 0 0); }
      92%   { clip-path: inset(0 0 0 0); }
      93%   { clip-path: inset(0 100% 0 0); }
      100%  { clip-path: inset(0 100% 0 0); }
    }
    @keyframes bl {
      0%, 50%   { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    /* Motion is additive. With no CSS, or under reduced motion, the
       terminal renders fully typed and static. */
    @media (prefers-reduced-motion: no-preference) {
      .ln  { clip-path: inset(0 100% 0 0); animation: rv 14s linear infinite both; }
      .d0  { animation-delay: 0.4s; }
      .d1  { animation-delay: 1.1s; }
      .d2  { animation-delay: 2.1s; }
      .d3  { animation-delay: 2.8s; }
      .d4  { animation-delay: 4.1s; }
      .d5  { animation-delay: 4.8s; }
      .d6  { animation-delay: 6.1s; }
      .d7  { animation-delay: 6.8s; }
      .cur { animation: bl 1.1s steps(1) infinite; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="469" rx="14" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

  <circle cx="34" cy="34" r="6" fill="#30363D"/>
  <circle cx="56" cy="34" r="6" fill="#30363D"/>
  <circle cx="78" cy="34" r="6" fill="#30363D"/>
  <text x="600" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6E7681">vaibhav700c ~ zsh</text>
  <line x1="0" y1="62" x2="1200" y2="62" stroke="#21262D" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">

    <g class="ln d0"><text x="40" y="108" fill="#C9D1D9"><tspan fill="#F0883E">$</tspan> whoami</text></g>
    <g class="ln d1"><text x="40" y="146" fill="#8B949E">Vaibhav Jangid, final-year CS at VIT</text></g>

    <g class="ln d2"><text x="40" y="194" fill="#C9D1D9"><tspan fill="#F0883E">$</tspan> cat now.txt</text></g>
    <g class="ln d3"><text x="40" y="232" fill="#8B949E">XR dev at a BCI startup. the interesting bits are under NDA.</text></g>

    <g class="ln d4"><text x="40" y="280" fill="#C9D1D9"><tspan fill="#F0883E">$</tspan> ls trophies/</text></g>
    <g class="ln d5"><text x="40" y="318" fill="#8B949E">cardano-1st   hackulus-1st   sprintathon-2nd   three-more-thirds</text></g>

    <g class="ln d6"><text x="40" y="366" fill="#C9D1D9"><tspan fill="#F0883E">$</tspan> ./ship.sh</text></g>
    <g class="ln d7">
      <text x="40" y="404" fill="#C9D1D9">still shipping.</text>
      <rect class="cur" x="180" y="390" width="9" height="18" fill="#F0883E"/>
    </g>

  </g>
</svg>
